<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #111418;
    color: #d8dee4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { display: flex; overflow: hidden; }

  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #161a1f;
    border-right: 1px solid #262c33;
    overflow-y: auto;
  }
  #sidebar h1 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b7684;
    padding: 16px 16px 8px;
    margin: 0;
  }
  .group-header {
    padding: 14px 16px 4px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #4b525c;
  }
  .group-header:first-of-type { padding-top: 4px; }
  .service {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .service:hover { background: #1d232b; }
  .service.selected { background: #1d232b; border-left-color: #4f8cff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .service-info { flex: 1; min-width: 0; }
  .service-name {
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .service-status { font-size: 11px; color: #6b7684; text-transform: capitalize; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #terminal-header {
    padding: 11px 16px 11px 20px;
    border-bottom: 1px solid #262c33;
    font-size: 13px;
    color: #a9b2bc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #header-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 5px;
    border: none;
    color: #8b95a1;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: #262c33; color: #4f8cff; }
  .icon-btn.danger:hover { color: #ff6b6b; }
  .icon-btn svg { width: 14px; height: 14px; }
  #terminal {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
    font-family: "SF Mono", Consolas, "Cascadia Code", monospace;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .log-line { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-all; }
  .log-line .ts { color: #4b525c; flex-shrink: 0; }
  .log-line .text.stderr { color: #ff8080; }
  .empty-state { color: #4b525c; padding: 4px 0; }

  .log-marker {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin: 4px 0;
    padding: 1px 0 1px 8px;
    font-style: italic;
    font-weight: 600;
    border-left: 2px solid currentColor;
  }
  .log-marker .ts { color: #4b525c; flex-shrink: 0; font-style: normal; font-weight: 400; }
  .log-marker.marker-starting { color: #4f8cff; }
  .log-marker.marker-healthy  { color: #3ecf8e; }
  .log-marker.marker-failed   { color: #ff5c5c; }
  .log-marker.marker-stopped  { color: #8b95a1; }

  .status-pending  { background: #4b525c; }
  .status-blocked  { background: #8a4a4a; }
  .status-manual   { background: #d9a441; }
  .status-starting { background: #4f8cff; }
  .status-healthy  { background: #3ecf8e; }
  .status-failed   { background: #ff5c5c; }
  .status-stopped  { background: #4b525c; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>rig</h1>
    <div id="service-list"></div>
  </div>
  <div id="main">
    <div id="terminal-header">
      <div id="header-title">Select a service</div>
      <div id="header-actions"></div>
    </div>
    <div id="terminal"><div class="empty-state">No service selected.</div></div>
  </div>

<script>
const RELOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>';
const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>';
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';

let services = {};
let selected = null;

const listEl = document.getElementById('service-list');
const termEl = document.getElementById('terminal');
const titleEl = document.getElementById('header-title');
const actionsEl = document.getElementById('header-actions');

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList() {
  listEl.innerHTML = '';

  const groups = new Map(); // first label (or "ungrouped") -> [svc, ...]
  Object.values(services).forEach(svc => {
    const label = (svc.labels && svc.labels.length) ? svc.labels[0] : 'ungrouped';
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(svc);
  });

  groups.forEach((list, label) => {
    const header = document.createElement('div');
    header.className = 'group-header';
    header.textContent = label;
    listEl.appendChild(header);

    list.forEach(svc => {
      const row = document.createElement('div');
      row.className = 'service' + (svc.name === selected ? ' selected' : '');
      row.onclick = () => selectService(svc.name);

      const dot = document.createElement('div');
      dot.className = 'dot status-' + svc.status;

      const info = document.createElement('div');
      info.className = 'service-info';
      info.innerHTML =
        '<div class="service-name">' + escapeHtml(svc.name) + '</div>' +
        '<div class="service-status">' + escapeHtml(svc.status) + '</div>';

      row.appendChild(dot);
      row.appendChild(info);

      listEl.appendChild(row);
    });
  });
}

async function selectService(name) {
  selected = name;
  titleEl.textContent = name;
  renderList();
  renderHeaderActions();
  termEl.innerHTML = '';
  try {
    const res = await fetch('/api/services/' + encodeURIComponent(name) + '/logs');
    const lines = await res.json();
    (lines || []).forEach(appendLogLine);
  } catch (e) {}
  scrollToBottom();
}

function iconButton(iconSvg, title, extraClass, onClick) {
  const btn = document.createElement('button');
  btn.className = 'icon-btn' + (extraClass ? ' ' + extraClass : '');
  btn.title = title;
  btn.setAttribute('aria-label', title);
  btn.innerHTML = iconSvg;
  btn.onclick = onClick;
  return btn;
}

function renderHeaderActions() {
  actionsEl.innerHTML = '';
  const svc = selected ? services[selected] : null;
  if (!svc) return;

  switch (svc.status) {
    case 'starting':
    case 'healthy':
      actionsEl.appendChild(iconButton(RELOAD_ICON, 'Restart', '', () => restartService(svc.name)));
      actionsEl.appendChild(iconButton(STOP_ICON, 'Stop', 'danger', () => stopService(svc.name)));
      break;
    case 'stopped':
      actionsEl.appendChild(iconButton(PLAY_ICON, 'Resume', '', () => restartService(svc.name)));
      break;
    case 'failed':
      actionsEl.appendChild(iconButton(RELOAD_ICON, 'Restart', '', () => restartService(svc.name)));
      break;
    case 'manual':
      actionsEl.appendChild(iconButton(RELOAD_ICON, 'Trigger', '', () => restartService(svc.name)));
      break;
    // pending/blocked: nothing to do yet, no actions
  }
}

async function restartService(name) {
  await fetch('/api/services/' + encodeURIComponent(name) + '/restart', { method: 'POST' });
}

async function stopService(name) {
  await fetch('/api/services/' + encodeURIComponent(name) + '/stop', { method: 'POST' });
}

const MARKER_LABEL = {
  starting: 'started',
  healthy:  'healthy',
  failed:   'failed',
  stopped:  'stopped',
};

function appendLogLine(entry) {
  if (entry.marker) {
    appendMarkerLine(entry.marker, entry.time);
    return;
  }
  const empty = termEl.querySelector('.empty-state');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'log-line';
  const ts = new Date(entry.time).toLocaleTimeString();
  const textClass = entry.stream === 'stderr' ? 'text stderr' : 'text';
  row.innerHTML =
    '<span class="ts">' + ts + '</span>' +
    '<span class="' + textClass + '">' + escapeHtml(entry.line) + '</span>';
  termEl.appendChild(row);
}

function appendMarkerLine(status, timeStr) {
  const label = MARKER_LABEL[status];
  if (!label) return;
  const empty = termEl.querySelector('.empty-state');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'log-marker marker-' + status;
  const ts = new Date(timeStr).toLocaleTimeString();
  row.innerHTML = '<span class="ts">' + ts + '</span><span>' + escapeHtml(label) + '</span>';
  termEl.appendChild(row);
}

function scrollToBottom() {
  termEl.scrollTop = termEl.scrollHeight;
}

async function loadServices() {
  const res = await fetch('/api/services');
  const list = await res.json();
  services = {};
  (list || []).forEach(s => { services[s.name] = s; });
  renderList();
  if (!selected && list && list.length) selectService(list[0].name);
}

function connectStream() {
  const es = new EventSource('/api/stream');
  es.onmessage = (ev) => {
    const data = JSON.parse(ev.data);
    if (data.type === 'status') {
      if (services[data.service]) {
        services[data.service].status = data.status;
        renderList();
        if (data.service === selected) {
          renderHeaderActions();
          appendMarkerLine(data.status, new Date().toISOString());
          scrollToBottom();
        }
      }
    } else if (data.type === 'log' && data.service === selected) {
      appendLogLine({ time: new Date().toISOString(), stream: data.stream, line: data.line });
      scrollToBottom();
    }
  };
  es.onerror = () => {
    es.close();
    setTimeout(connectStream, 2000);
  };
}

loadServices();
connectStream();
</script>
</body>
</html>
